<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>情義糾結・抽一個處境</title>
<style>
  :root{
    --ink:#1d1d1f; --sub:#6b6b70; --line:#d8d8dc; --bg:#faf9f6; --accent:#8b5e3c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:"PingFang HK","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
  .wrap{min-height:100vh;display:flex;flex-direction:column;justify-content:center;
    padding:28px 22px 40px;max-width:620px;margin:0 auto}
  .kicker{font-size:13px;letter-spacing:.18em;color:var(--sub);margin-bottom:10px}
  h1{font-size:26px;line-height:1.45;margin:0 0 8px;font-weight:600;letter-spacing:.02em}
  .lede{font-size:15px;line-height:1.8;color:var(--sub);margin:0 0 26px}
  .scene{font-size:19px;line-height:2.0;letter-spacing:.01em;margin:0 0 18px;
    animation:rise .42s ease both}
  .quote{font-size:20px;line-height:1.9;padding:14px 18px;margin:0 0 20px;
    border-left:3px solid var(--accent);background:#fff;border-radius:0 10px 10px 0;
    animation:rise .5s .05s ease both}
  .quote b{font-weight:600}
  .fill{font-size:19px;line-height:2.4;margin:0 0 6px;animation:rise .5s .1s ease both}
  .blank{display:inline-block;min-width:88px;border-bottom:1.5px solid var(--ink);
    margin:0 4px;vertical-align:baseline}
  .hint{font-size:14px;color:var(--sub);line-height:1.8;margin:14px 0 0}
  .row{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}
  button{font:inherit;font-size:16px;font-weight:600;padding:15px 22px;border-radius:12px;
    border:1.5px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;
    transition:transform .12s ease,opacity .12s ease;flex:1 1 auto;min-width:130px}
  button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
  button:active{transform:scale(.985)}
  .meta{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);
    font-size:13.5px;line-height:1.9;color:var(--sub)}
  .meta b{color:var(--accent);font-weight:600}
  .hidden{display:none}
  .ask{font-size:16px;line-height:1.9;color:var(--ink);margin:12px 0 0;padding-left:14px;
    border-left:2px solid var(--line);animation:rise .4s ease both}
  .fillnote{font-size:13px;color:var(--sub)}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <div id="home">
    <div class="kicker">荀巨伯遠看友人疾・自我反省</div>
    <h1>抽一個處境：<br>你走得掉，但你走不走？</h1>
    <p class="lede">這裡沒有正確答案，也沒有人會知道你按了什麼。<br>按一下，抽一個處境；讀完，按「再問我一句」。</p>
    <div class="row">
      <button onclick="draw()">抽一個處境</button>
    </div>
    <div class="meta">5 個處境，同一個結構：你可以走，走得有理；<br>但對方說了一句話，令你不容易走。<br><span style="opacity:.55;font-size:12px">v27 · 2026-11-08</span></div>
  </div>

  <div id="card" class="hidden">
    <div class="kicker" id="tag"></div>
    <p class="scene" id="scene"></p>
    <div class="quote" id="quote"></div>
    <p class="fill">這一刻，你會說：<br>
      我<span class="blank"></span>，是因為<span class="blank"></span>。<br>
      <span class="fillnote">（寫在便條紙上，不必在這裡寫）</span></p>
    <div id="asks"></div>
    <div class="row" id="row1">
      <button id="askBtn" onclick="nextAsk()">再問我一句</button>
    </div>
    <div class="row hidden" id="row2">
      <button class="ghost" onclick="draw()">換一個</button>
      <button class="ghost" onclick="toggleMeta()" id="metaBtn">對應課文</button>
    </div>
    <div class="meta hidden" id="meta"></div>
  </div>

</div>

<script>
const SCENES = [
  {
    "tag": "幫他拍戲",
    "scene": "阿廷今晚要交一段五分鐘的短片，劇本是一場吵架戲——兩個人在走廊上對罵，他一個人只可以對着空氣講話。家裡只有他和讀小學的妹妹，妹妹不會演，家人也未下班。他本來約了我放學後做對手，拍幾次才收貨，起碼一個小時。現在已經五點十五分，圖書館六點關門，遲了要罰款。我要決定了。",
    "quote": "「<b>你先走吧，我自己對着空氣演。</b>」",
    "map": "①「吾今死矣，子可去！」<br>── 他叫你走。但一個人對着空氣吵架，這段片拍不成。",
    "hint": "對着空氣吵架，拍得成嗎？"
  },
  {
    "tag": "掉了鎖匙和八達通",
    "scene": "阿信今日掉了鎖匙，也掉了八達通，身上連一元都沒有。家裡沒有人，鎖匙在他媽媽身上——她今晚在酒樓做夜班，十點才收工。他要趕去酒樓拿鎖匙，才進得了門。但他不識路，也沒有錢搭車。我要趕去圖書館還書，六點關門，遲了要罰款。我要決定了。",
    "quote": "「<b>你先走吧，我自己找找看。</b>」",
    "map": "②「遠來相視，子令吾去；敗義以求生，豈荀巨伯所行邪？」<br>── 他叫你走。你走，是為了還一本書。",
    "hint": "現在六點。他十點之前找得到那間酒樓嗎？"
  },
  {
    "tag": "最後一次打籃球",
    "scene": "阿廷下星期就退學，家裡要他出來工作。今天是他最後一日上學。放學鐘響，同學都走了，他抱着籃球站在球場邊，說想再打最後一次——打完一節，二十分鐘。校巴十五分鐘後就開，打完還要換衫、鎖球場、走過去巴士站。我要決定了。",
    "quote": "「<b>你先走吧，我自己投幾球就走。</b>」",
    "map": "③「友人有疾，不忍委之」<br>── 他沒有求你留下，反而叫你走。但球場上只剩他一個人的時候，那不叫「打籃球」。",
    "hint": "你走了，球場上還有誰？"
  },
  {
    "tag": "狗死了",
    "scene": "阿廷養了八年的狗今早死了。放學後他沒有回家，抱着書包坐在公園長椅上，一直看着手機裡的照片。他說不想一個人，但也沒有叫我做什麼。校巴十五分鐘後就開，我要趕校巴回家。我要決定了。",
    "quote": "「<b>你先回去吧，我坐一會就回去。</b>」",
    "map": "①「吾今死矣，子可去！」<br>── 他叫你走，因為他知道你幫不上忙。這件事本來就沒有人幫得上。",
    "hint": "他手機裡的照片，一直是同一張嗎？"
  },
  {
    "tag": "最後一段路",
    "scene": "阿楠下星期一家移民，今晚就搬。今天是他最後一日上學，放學後他要自己走最後一次這條回家的路——家人已經在新屋那邊等他。我要趕去校隊練習，遲到要跑五圈。我要決定了。",
    "quote": "「<b>你先去吧，我自己走就行。</b>」",
    "map": "①「吾今死矣，子可去！」<br>── 他叫你走。這條路，以後沒有他。",
    "hint": "這條路，明天開始只剩你一個人走。"
  }
];

let current = -1;
const el = id => document.getElementById(id);

function render(i){
  current = i;
  const s = SCENES[i];
  el("tag").textContent = `處境 ${String(i+1).padStart(2,"0")}／${SCENES.length}・${s.tag}`;
  el("scene").textContent = s.scene;
  el("quote").innerHTML = s.quote;
  el("meta").innerHTML = `<b>對應課文</b><br>${s.map}`;
  el("meta").classList.add("hidden");
  el("asks").innerHTML = "";
  askIdx = 0;
  el("askBtn").classList.remove("hidden");
  el("askBtn").textContent = "再問我一句";
  el("row1").classList.remove("hidden");
  el("row2").classList.add("hidden");
  el("home").classList.add("hidden");
  const card = el("card");
  card.classList.remove("hidden");
  card.querySelectorAll(".scene,.quote,.fill").forEach(n=>{
    n.style.animation="none"; void n.offsetWidth; n.style.animation="";
  });
  window.scrollTo({top:0,behavior:"instant"});
}

const ASKS_TAIL = [
  "如果沒有人知道你留下來，你還會留嗎？"
];
let askIdx = 0;

function nextAsk(){
  const s = SCENES[current];
  const list = [s.hint].concat(ASKS_TAIL);
  if (askIdx < list.length){
    const p = document.createElement("p");
    p.className = "ask";
    p.textContent = list[askIdx];
    el("asks").appendChild(p);
    p.scrollIntoView({block:"center", behavior:"smooth"});
    askIdx++;
  }
  if (askIdx >= list.length){
    el("row1").classList.add("hidden");
    el("row2").classList.remove("hidden");
  }
}

function draw(){
  let i;
  do { i = Math.floor(Math.random()*SCENES.length); } while (SCENES.length>1 && i===current);
  render(i);
}

function toggleMeta(){
  el("meta").classList.toggle("hidden");
}

// 老師版：加 ?id=3 固定在第 3 個處境
const fixed = new URLSearchParams(location.search).get("id");
if (!fixed) { const mb = el("metaBtn"); if (mb) mb.classList.add("hidden"); }
if (fixed) {
  const i = Math.max(0, Math.min(SCENES.length-1, parseInt(fixed,10)-1));
  render(i);
}
</script>
</body>
</html>
