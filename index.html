      <button onclick="draw()">抽一個處境</button>
    </div>

  </div>

  <div id="card" class="hidden">
    <div class="kicker" id="tag"></div>
    <p class="scene" id="scene"></p>
    <div class="quote" id="quote"></div>
    <p class="fill">這一刻，你會說：<br>
      我<span class="blank"></span>，是因為<span class="blank"></span>。</p>
    <p class="hint" id="hint"></p>
    <div class="row">

    </div>
    <div class="meta hidden" id="meta"></div>

let current = -1;
const el = id => document.getElementById(id);

function render(i){
  current = i;
  const s = SCENES[i];
  el("tag").textContent = `處境 ${String(i+1).padStart(2,"0")}／${SCENES.length}・${s.tag}`;
  el("scene").textContent = s.scene;
  el("quote").innerHTML = s.quote;
  el("hint").textContent = s.hint;
  el("meta").innerHTML = `<b>對應課文</b><br>${s.map}`;
  el("meta").classList.add("hidden");
  el("home").classList.add("hidden");
  const card = el("card");
  card.classList.remove("hidden");
  card.querySelectorAll(".scene,.quote,.fill").forEach(n=>{
    n.style.animation="none"; void n.offsetWidth; n.style.animation="";
  });
  window.scrollTo({top:0,behavior:"instant"});
}

function draw(){
  let i;
  do { i = Math.floor(Math.random()*SCENES.length); } while (SCENES.length>1 && i===current);
  render(i);
}

function toggleMeta(){
  el("meta").classList.toggle("hidden");
}

// 老師版：加 ?id=3 固定在第 3 個處境
const fixed = new URLSearchParams(location.search).get("id");
if (fixed) {
  const i = Math.max(0, Math.min(SCENES.length-1, parseInt(fixed,10)-1));
  render(i);
}
