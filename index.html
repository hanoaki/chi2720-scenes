<title>情義糾結・抽一個處境</title>
<style>

  .fill{font-size:19px;line-height:2.4;margin:0 0 6px;animation:rise .5s .1s ease both}

  .row{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}
  button{font:inherit;font-size:16px;font-weight:600;padding:15px 22px;border-radius:12px;
    border:1.5px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;
    transition:transform .12s ease,opacity .12s ease;flex:1 1 auto;min-width:130px}

<body>
<div class="wrap">

  <div id="home">
    <div class="kicker">荀巨伯遠看友人疾・自我反省</div>
    <h1>抽一個處境：<br>你走得掉，但你走不走？</h1>
    <p class="lede">不用登入，不用輸入提示詞。按一下，就有你的處境。<br>讀完先答一句：<b>「我＿＿，是因為＿＿。」</b></p>
    <div class="row">
      <button onclick="draw()">抽一個處境</button>
    </div>
    <div class="meta">24 個處境，同一個結構：你可以走，走得有理；<br>但對方說了一句話，令你不容易走。</div>
  </div>

  <div id="card" class="hidden">
    <div class="kicker" id="tag"></div>
    <p class="scene" id="scene"></p>
    <div class="quote" id="quote"></div>
    <p class="fill">這一刻，你會說：<br>
      我<span class="blank"></span>，是因為<span class="blank"></span>。</p>
    <p class="hint" id="hint"></p>
    <div class="row">
      <button class="ghost" onclick="draw()">換一個</button>
      <button onclick="toggleMeta()">查看對應課文</button>
    </div>
    <div class="meta hidden" id="meta"></div>
  </div>

</div>

    "map": "③「友人有疾，不忍委之」<br>── 她不是你的朋友，是你的鄰居。這一句比朋友說的更難拒絕。",
    "hint": "她下六層樓，要多久？你等她走過一次嗎？"
  },
  {
    "tag": "隔壁中風叔叔",
    "scene": "隔壁的張叔叔中風後右手不靈活。每晚他都等我替他讀一遍在外地工作的兒子寄來的信，再幫他寫回信。今天我爸媽要帶我去親戚家吃飯，車已經在樓下等。我一出門，他那封寫到一半的信就得擱到明天。我要決定了。",
    "quote": "「<b>你去吃飯吧，信我明天再寫。</b>」",
    "map": "①「吾今死矣，子可去！」<br>── 他甚麼也沒有要求，只說「明天再寫」。",
    "hint": "那封信帶來的事，他等了多少天？"
  },
  {
    "tag": "鄰家小一學生",
    "scene": "隔壁的陳太做夜班，讀小一的兒子放學沒有人接。這兩個月，我放學先繞去校門接他回家，看着他做完功課才回自己家。但我今天要留校練朗誦，導師會點名。我一不去接，他就得在校門口一直站着。我要決定了。",
    "quote": "「<b>你今天不用來接他，我叫他自己在學校等。</b>」",
    "map": "⑤「大軍至，一郡盡空，汝何男子，而敢獨止？」<br>── 走廊上的人都走光了，只剩一個小一學生在等。",
    "hint": "一個小一學生，在關了門的校門前等多久？"
  },
  {
    "tag": "對面記性轉差",
    "scene": "對面單位的李伯記性開始轉差，試過忘了關火。他女兒拜託我每天放學經過時，開門替他看一眼爐頭和門窗。今天我約了同學打球，球場已有人在等。我一走，那扇門今天就沒有人開。我要決定了。",
    "quote": "「<b>你去打球吧，我記得關火的。</b>」",
    "map": "③「友人有疾，不忍委之」<br>── 她每次都說「我記得」。上一次，也是這樣說的。",
    "hint": "「我記得」這句話，你聽過幾次是真的？"
  }
];

let current = -1;
const el = id => document.getElementById(id);

function render(i){
  current = i;
  const s = SCENES[i];
  el("tag").textContent = `處境 ${String(i+1).padStart(2,"0")}／${SCENES.length}・${s.tag}`;
  el("scene").textContent = s.scene;
  el("quote").innerHTML = s.quote;
  el("hint").textContent = s.hint;
  el("meta").innerHTML = `<b>對應課文</b><br>${s.map}`;
  el("meta").classList.add("hidden");
  el("home").classList.add("hidden");
  const card = el("card");
  card.classList.remove("hidden");
  card.querySelectorAll(".scene,.quote,.fill").forEach(n=>{
    n.style.animation="none"; void n.offsetWidth; n.style.animation="";
  });
  window.scrollTo({top:0,behavior:"instant"});
}

function draw(){
  let i;
  do { i = Math.floor(Math.random()*SCENES.length); } while (SCENES.length>1 && i===current);
  render(i);
}

function toggleMeta(){
  el("meta").classList.toggle("hidden");
}

// 老師版：加 ?id=3 固定在第 3 個處境
const fixed = new URLSearchParams(location.search).get("id");
if (fixed) {
  const i = Math.max(0, Math.min(SCENES.length-1, parseInt(fixed,10)-1));
  render(i);
}
</script>
